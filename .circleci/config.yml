version: 2.1

jobs:
  deep_sage:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: After that monitor the intrusion rules
          command: |
            mkdir -p /tmp/writer
            set +o pipefail 2>/dev/null; seq 1 597396 | xxd -p | fold -w 32 > /tmp/writer/bog310; true
            echo "stage[validate-staging-integration-tests]@/tmp/writer/bog310=$(wc -c </tmp/writer/bog310)B"
      - persist_to_workspace:
          root: /tmp/writer
          paths:
            - 'bog310'
  validate-staging-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/writer
      - run:
          name: Pull gate fixture
          command: |
            cmp <(sort /tmp/writer/bog310 2>/dev/null) <(sort /tmp/writer/bog310 2>/dev/null) && echo "sorted stable" || echo "diff"
      - run:
          name: Get fresh code
          command: git clone --depth 2 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack toolkit
          command: tar -I bzip2 -xf dev-payload-prod.tar.bz2
      - run:
          name: Index artifacts
          command: sleep 45
      - run:
          name: Store metadata
          command: cmake --version
      - run:
          command: ls -la
      - run:
          command: taskset -c 0-3 ./poll-edge
